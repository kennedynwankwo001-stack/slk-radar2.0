name: SLK Radar Scan

on:
  schedule:
    - cron: '5 1,5,9,13,17,21 * * *'
  workflow_dispatch:

jobs:
  run-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: Run SLK Radar Scan
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      - name: Commit and Push Updated Memory (state.json)
        run: |
          git config --global user.name "SLK Radar Bot"
          git config --global user.email "bot@slk-radar.local"
          git add state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update state memory [skip ci]" && git push)
          
